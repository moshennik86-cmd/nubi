<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>누비</title>
<meta name="theme-color" content="#2B4C86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- Шрифты -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<!-- Карта: библиотека Leaflet + карты OpenStreetMap (бесплатно) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app"></div>

<nav id="nav" hidden><div class="in">
  <button data-tab="walk"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span data-i="navWalk"></span></button>
  <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span data-i="navMap"></span></button>
  <button data-tab="chal"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span data-i="navChal"></span></button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i="navMe"></span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span data-i="navMore"></span></button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<!-- Языки: каждый язык — отдельный файл. Новый язык = новый файл + строка в js/i18n/index.js -->
<script src="js/i18n/ko.js"></script>
<script src="js/i18n/ru.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/index.js"></script>
<!-- Данные: легенды, челленджи, звания -->
<script src="js/legends-main.js"></script>
<script src="js/legends-hwaseong.js"></script>
<script src="js/data.js"></script>
<!-- Логика приложения -->
<script src="js/geo.js"></script>
<script src="js/camera.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
<script>
  // Регистрируем service worker — нужен, чтобы приложение можно было установить на телефон
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
